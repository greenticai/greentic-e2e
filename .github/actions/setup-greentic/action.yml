name: Setup Greentic
description: >-
  Shared toolchain bootstrap for the e2e workflows: pins Rust, installs
  cargo-binstall, installs the gtc CLI, and installs the pinned Greentic
  toolchain release's binaries. Every step exports GITHUB_TOKEN so cargo-binstall's
  api.github.com release lookups are authenticated — unauthenticated calls
  from shared runner IPs hit 403 rate limits, fall back to multi-minute
  source builds, and have timed out whole matrix jobs.

  Every step here reaches the network, so every step is a single point of
  failure for a whole matrix job. They all route through lib/net.sh's bounded
  retries — see that file for why, and scripts/test_setup_greentic_net.sh for
  the tests.

inputs:
  rust-version:
    description: >-
      Rust toolchain version to pin.

      This repo ships no Rust code of its own, so the pin exists for exactly one
      job: building CLIs from source when no prebuilt artifact is usable. In
      practice that is Windows, where `Install cargo-binstall` below compiles
      cargo-binstall rather than downloading it.

      **It must therefore stay at or above the MSRV of cargo-binstall's whole
      dependency tree**, which the pin has no way of announcing. It sat at
      1.95.0 while cargo-binstall 1.22.0 (2026-08-22) pulled vergen 10.0.2,
      whose MSRV is 1.96.0 — so both Windows jobs died in `cargo install` with
      "rustc 1.95.0 is not supported by the following packages", every night,
      from 2026-08-23 onward. Nothing else in the matrix noticed: Linux and
      macOS take the prebuilt path and never invoke rustc at all.

      Bumping is safe for the wasm fixtures. `fixtures/packs/*/components/
      bug3-test/rust-toolchain.toml` pins its own channel AND declares its own
      `targets`, so rustup provisions that toolchain plus wasm32-wasip2 on
      demand, independent of this input — which is also why the guard workflows
      build those components with `wasm-target: 'false'`.
    default: '1.98.0'
  wasm-target:
    description: Also install the wasm32-wasip2 target
    default: 'false'
  gtc-version:
    description: gtc crate version to install ('latest' = unpinned)
    default: 'latest'
  gtc-release:
    description: >-
      Pinned Greentic toolchain release passed to `gtc install --release`.
      Bump here to roll every workflow forward at once.

      Keep this at or above the newest fix any suite asserts. It sat at 1.1.2
      (2026-07-07) while regression-guards-e2e.yml guarded three fixes that all
      landed 2026-07-23 — greentic-setup #232, greentic-start #438,
      greentic-runner #611 — so those guards tested pre-fix binaries and failed
      on every scheduled run since they were added. A stale pin here does not
      announce itself: the suites that do not assert new behaviour stay green.
    default: '1.1.13'
  install-gtc:
    description: Install the gtc CLI via cargo-binstall
    default: 'true'
  install-toolchain:
    description: >-
      Run `gtc install --release <gtc-release> --install-binaries-only` after
      installing the CLI. Binaries only: the release pack/component prefetch is
      unused here and is the workflows' main source of transient ghcr.io
      failures — see the step body.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Bootstrap Rust ${{ inputs.rust-version }}
      shell: bash
      run: |
        set -euo pipefail
        . "${GITHUB_ACTION_PATH}/lib/net.sh"
        if ! command -v rustup >/dev/null 2>&1; then
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            gt_fetch https://win.rustup.rs/x86_64 rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-toolchain "${{ inputs.rust-version }}"
          else
            # Fetched to a file rather than piped into `sh`: a reset mid-transfer
            # would otherwise hand the shell a truncated installer, which runs.
            gt_fetch https://sh.rustup.rs rustup-init.sh
            sh rustup-init.sh -y --profile minimal --default-toolchain "${{ inputs.rust-version }}"
            rm -f rustup-init.sh
          fi
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup toolchain install "${{ inputs.rust-version }}" --profile minimal
        rustup default "${{ inputs.rust-version }}"
        if [[ "${{ inputs.wasm-target }}" == "true" ]]; then
          rustup target add wasm32-wasip2 --toolchain "${{ inputs.rust-version }}"
        fi
        rustc --version
        cargo --version

    - name: Install cargo-binstall
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        . "${GITHUB_ACTION_PATH}/lib/net.sh"
        export PATH="$HOME/.cargo/bin:$PATH"
        if command -v cargo-binstall >/dev/null 2>&1; then
          cargo binstall -V
          exit 0
        fi
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          # Deliberately a SMALLER budget than lib/net.sh's default. This is a
          # source build, not a fetch: on Windows it has taken 20-100 minutes,
          # and the failure it is most likely to hit is a deterministic compile
          # error (an MSRV bump — see rust-version above), which no number of
          # retries fixes. One retry covers a transient crates.io blip without
          # risking four full builds against the job timeout.
          GT_RETRY_ATTEMPTS=2
          gt_retry "cargo install cargo-binstall" cargo install cargo-binstall --locked
        else
          # This fetch ran exactly once and took `tenant-binding` down in run
          # 33363027898 on a single `curl: (35) Recv failure: Connection reset
          # by peer`, 53ms in. The two sibling matrix jobs pulled the same url
          # seconds either side and passed — the url was fine, the step just had
          # no second attempt. Both ends of this chain already retried (the
          # `gtc install` step below, and the installer's own
          # `curl --retry 10` for its tarball); only our fetch of the installer
          # did not.
          #
          # Materialised to a file instead of `| bash` so a partial download can
          # never be executed. See lib/net.sh.
          installer="${RUNNER_TEMP:-/tmp}/install-from-binstall-release.sh"
          gt_fetch \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            "$installer"
          bash "$installer"
          rm -f "$installer"
        fi
        cargo binstall -V

    - name: Install gtc CLI
      if: inputs.install-gtc == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      run: |
        set -euo pipefail
        . "${GITHUB_ACTION_PATH}/lib/net.sh"
        export PATH="$HOME/.cargo/bin:$PATH"
        if [[ -z "${{ inputs.gtc-version }}" || "${{ inputs.gtc-version }}" == "latest" ]]; then
          gt_retry "cargo binstall gtc" cargo binstall -y gtc
        else
          gt_retry "cargo binstall gtc" cargo binstall -y "gtc@${{ inputs.gtc-version }}"
        fi
        gtc --version

    - name: Install Greentic toolchain (release ${{ inputs.gtc-release }})
      if: inputs.install-toolchain == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      run: |
        set -euo pipefail
        . "${GITHUB_ACTION_PATH}/lib/net.sh"
        export PATH="$HOME/.cargo/bin:$PATH"
        # `--install-binaries-only` skips `gtc install`'s second phase: an
        # all-or-nothing prefetch of every pack and component in the pinned
        # release (92 ghcr.io blob pulls for 1.1.2). One transient blob error
        # anywhere in that loop aborts the whole install, and the skip-list is
        # keyed off a release index that is only written after the loop fully
        # succeeds — so the retry below redoes all 92 pulls instead of resuming.
        # Run 30326880926 lost messaging-teams exactly that way: three attempts,
        # three different packs, each `error sending request for url
        # https://ghcr.io/v2/.../blobs/sha256:...`.
        #
        # Nothing downstream reads that prefetch. Every e2e bundle names its
        # packs by explicit `oci://ghcr.io/...:latest` reference and caches them
        # workspace-local, so the packs are pulled on demand at `gtc wizard`
        # time either way; the release index only maps the `:stable` channel
        # tag, which no fixture uses. Verified by running the dummy-provider job
        # both ways: identical ingress responses and start.log, ~/.greentic left
        # at 36K instead of 1.3G, ~92 ghcr blob pulls per job down to 0.
        #
        # `gtc install` itself is still covered — nightly-e2e.yml runs the full
        # unflagged install as its test subject and passes install-toolchain:
        # false here. Self-update to the pinned gtc still happens: it is gated
        # on the binaries phase, not the artifact phase.
        #
        # The retry stays for the binary downloads, which still hit the network.
        #
        # Kept on its own budget rather than lib/net.sh's default: a retry here
        # redoes the whole binary set, so it is worth waiting longer between
        # attempts and trying fewer times than for a single script fetch.
        GT_RETRY_ATTEMPTS=3
        GT_RETRY_BASE_DELAY=15
        gt_retry "gtc install" \
          gtc install --release "${{ inputs.gtc-release }}" --install-binaries-only
