name: Setup Greentic
description: >-
  Shared toolchain bootstrap for the e2e workflows: pins Rust, installs
  cargo-binstall, installs the gtc CLI, and installs the pinned Greentic
  toolchain release's binaries. Every step exports GITHUB_TOKEN so cargo-binstall's
  api.github.com release lookups are authenticated — unauthenticated calls
  from shared runner IPs hit 403 rate limits, fall back to multi-minute
  source builds, and have timed out whole matrix jobs.

inputs:
  rust-version:
    description: Rust toolchain version to pin
    default: '1.95.0'
  wasm-target:
    description: Also install the wasm32-wasip2 target
    default: 'false'
  gtc-version:
    description: gtc crate version to install ('latest' = unpinned)
    default: 'latest'
  gtc-release:
    description: >-
      Pinned Greentic toolchain release passed to `gtc install --release`.
      Bump here to roll every workflow forward at once.
    default: '1.1.2'
  install-gtc:
    description: Install the gtc CLI via cargo-binstall
    default: 'true'
  install-toolchain:
    description: >-
      Run `gtc install --release <gtc-release> --install-binaries-only` after
      installing the CLI. Binaries only: the release pack/component prefetch is
      unused here and is the workflows' main source of transient ghcr.io
      failures — see the step body.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Bootstrap Rust ${{ inputs.rust-version }}
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null 2>&1; then
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            curl -fsSL -o rustup-init.exe https://win.rustup.rs/x86_64
            ./rustup-init.exe -y --profile minimal --default-toolchain "${{ inputs.rust-version }}"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain "${{ inputs.rust-version }}"
          fi
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup toolchain install "${{ inputs.rust-version }}" --profile minimal
        rustup default "${{ inputs.rust-version }}"
        if [[ "${{ inputs.wasm-target }}" == "true" ]]; then
          rustup target add wasm32-wasip2 --toolchain "${{ inputs.rust-version }}"
        fi
        rustc --version
        cargo --version

    - name: Install cargo-binstall
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        if command -v cargo-binstall >/dev/null 2>&1; then
          cargo binstall -V
          exit 0
        fi
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          cargo install cargo-binstall --locked
        else
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        fi

    - name: Install gtc CLI
      if: inputs.install-gtc == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        if [[ -z "${{ inputs.gtc-version }}" || "${{ inputs.gtc-version }}" == "latest" ]]; then
          cargo binstall -y gtc
        else
          cargo binstall -y "gtc@${{ inputs.gtc-version }}"
        fi
        gtc --version

    - name: Install Greentic toolchain (release ${{ inputs.gtc-release }})
      if: inputs.install-toolchain == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        # `--install-binaries-only` skips `gtc install`'s second phase: an
        # all-or-nothing prefetch of every pack and component in the pinned
        # release (92 ghcr.io blob pulls for 1.1.2). One transient blob error
        # anywhere in that loop aborts the whole install, and the skip-list is
        # keyed off a release index that is only written after the loop fully
        # succeeds — so the retry below redoes all 92 pulls instead of resuming.
        # Run 30326880926 lost messaging-teams exactly that way: three attempts,
        # three different packs, each `error sending request for url
        # https://ghcr.io/v2/.../blobs/sha256:...`.
        #
        # Nothing downstream reads that prefetch. Every e2e bundle names its
        # packs by explicit `oci://ghcr.io/...:latest` reference and caches them
        # workspace-local, so the packs are pulled on demand at `gtc wizard`
        # time either way; the release index only maps the `:stable` channel
        # tag, which no fixture uses. Verified by running the dummy-provider job
        # both ways: identical ingress responses and start.log, ~/.greentic left
        # at 36K instead of 1.3G, ~92 ghcr blob pulls per job down to 0.
        #
        # `gtc install` itself is still covered — nightly-e2e.yml runs the full
        # unflagged install as its test subject and passes install-toolchain:
        # false here. Self-update to the pinned gtc still happens: it is gated
        # on the binaries phase, not the artifact phase.
        #
        # The retry stays for the binary downloads, which still hit the network.
        attempt=1
        max_attempts=3
        until gtc install --release "${{ inputs.gtc-release }}" --install-binaries-only; do
          if [[ "$attempt" -ge "$max_attempts" ]]; then
            echo "gtc install failed after ${max_attempts} attempts" >&2
            exit 1
          fi
          delay=$((attempt * 15))
          echo "gtc install attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s" >&2
          sleep "${delay}"
          attempt=$((attempt + 1))
        done
