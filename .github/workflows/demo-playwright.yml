name: Nightly demo Playwright e2e

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC, after nightly-e2e (00:00) & cloud-demo (02:00)
  workflow_dispatch:
    inputs:
      gtc_channel:
        description: 'gtc channel(s)'
        type: choice
        options: [both, stable, dev]
        default: both
      demo_filter:
        description: 'comma-separated demo names, or "all"'
        default: 'all'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the channel matrix from the workflow_dispatch `gtc_channel` input so a
  # manual run can target a single channel (e.g. "stable" -> stable-linux only).
  # Scheduled runs (no input) fall back to "both". stable-macos is intentionally
  # absent because `gtc install` falls back to `greentic-setup@0.5.1` on macOS
  # (Maarten's Fix 2 `--non-interactive` only ships in 0.5.2 and the macOS
  # aarch64 artifact for 0.5.2 is missing/broken in the greentic-setup release).
  # Restore the cell once the upstream artifact is published. See PR-1 item #6.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          # Scheduled runs are stable-only: the dev channel cannot install at
          # all right now (see below), so running it nightly costs ~10 minutes
          # of runner time to produce zero signal. `workflow_dispatch` can still
          # ask for `dev` or `both` explicitly to check whether it has recovered.
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.gtc_channel || 'stable' }}
        run: |
          set -euo pipefail
          stable='{"label":"stable-linux","runner":"ubuntu-24.04","channel":"stable"}'
          dev='{"label":"dev-linux","runner":"ubuntu-24.04","channel":"dev"}'
          case "$REQUESTED" in
            stable) include="[$stable]" ;;
            dev)    include="[$dev]" ;;
            *)      include="[$stable,$dev]" ;;
          esac
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: plan
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The dev lane is advisory, and off by default on the nightly (see `plan`).
    # `gtc install --channel dev` cannot succeed: the toolchain manifest served
    # from ghcr.io/greenticai/greentic-versions/gtc:dev pairs each LIBRARY crate
    # with the BINARY ALIAS's bin name (crate `greentic-dev`, bins
    # [`greentic-dev-dev`]) — but that bin lives in a separate crates.io crate
    # (`greentic-dev-dev`). cargo binstall is handed the pair verbatim and dies
    # on packages[0]; all 13 entries are broken the same way, and several of the
    # pinned versions are now yanked besides. It is stale published DATA, not a
    # code bug — the manifest generator was fixed 2026-06-30 but the dev manifest
    # was never regenerated. Fix: regenerate + republish from greentic-dev
    # (`release snapshot --channel dev`). Re-enable this lane once that lands.
    continue-on-error: ${{ matrix.channel == 'dev' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GTC_CHANNEL: ${{ matrix.channel }}
      DEMO_FILTER: ${{ inputs.demo_filter || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust + cargo-binstall
        uses: ./.github/actions/setup-greentic
        with:
          wasm-target: 'true'
          # bootstrap-gtc.sh owns the gtc install so the two channels get
          # their gtc-stable / gtc-dev binary names.
          install-gtc: 'false'
          install-toolchain: 'false'

      - name: Install OS deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y squashfs-tools jq

      - name: Install gtc (channel = ${{ matrix.channel }})
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash playwright/scripts/bootstrap-gtc.sh "${GTC_CHANNEL}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json

      - name: Install npm deps
        working-directory: playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: playwright
        env:
          GTC_BIN: gtc-${{ matrix.channel }}
          DEMO_FILTER: ${{ env.DEMO_FILTER }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          # DeepSeek backs every LLM-based test (pet-daycare fast2flow tier,
          # deep-research, helpdesk-itsm). When unset they soft-skip. DeepSeek
          # is a native greentic-llm provider (pet-daycare's fast2flow tier) and
          # an OpenAI-compatible endpoint (deep-research/helpdesk component-llm).
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          # TEMPORARY: the DEEPSEEK_KEY is currently non-functional (nightly
          # 2026-07-26 got HTTP 400 — account balance / upstream contract, not a
          # code bug). Stand the LLM-dependent tests + credential canary down so
          # the nightly stops going red for something we can't fix in this repo.
          # A repo variable can override without a code change; the default keeps
          # it stood down. REMOVE this once the key is restored so the canary
          # resumes catching a genuinely broken secret.
          DEEPSEEK_KNOWN_BROKEN: ${{ vars.DEEPSEEK_KNOWN_BROKEN || '1' }}
        run: npx playwright test --project="${GTC_CHANNEL}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.label }}
          path: playwright/playwright-report/
          retention-days: 14

      - name: Upload failures (traces, videos, gtc logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ matrix.label }}
          path: |
            playwright/test-results/
            playwright/tmp/**/gtc-*.log
          retention-days: 14
